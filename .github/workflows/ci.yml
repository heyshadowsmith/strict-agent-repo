name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  diagnostics:
    name: Full Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostics
        run: bash diagnostics/full.sh
