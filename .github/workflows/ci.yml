name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    name: Full Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=moderate || echo "::warning::npm audit found vulnerabilities in dependencies"

      - name: Run diagnostics
        run: bash diagnostics/full.sh
